<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - IoT</title>
    <!-- Tailwind CSS para um visual moderno -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js para o Gráfico -->
    <script src="https://jsdelivr.net"></script>
    <!-- Cliente do Supabase -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho com o nome da sua Empresa -->
    <header class="bg-slate-800 border-b border-slate-700 p-6 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide uppercase text-amber-500">[SYSTEM REFRIGERACAO]</h1>
        <p class="text-slate-400 text-sm mt-1">Sistema de Telemetria e Monitoramento de Temperatura a Distância</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-6 justify-center">
        
        <!-- Cartão de Destaque com a Última Temperatura -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg text-center max-w-sm mx-auto w-full">
            <h2 class="text-slate-400 font-medium uppercase text-xs tracking-wider">Última Leitura</h2>
            <div class="text-5xl font-black text-amber-500 mt-2" id="temp-atual">--.-°C</div>
            <p class="text-xs text-slate-500 mt-2" id="tempo-atualizacao">Atualizando...</p>
        </div>

        <!-- Área do Gráfico -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg w-full">
            <canvas id="graficoTemperatura" class="w-full h-72"></canvas>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 [Nome da sua Empresa] - Todos os direitos reservados.
    </footer>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        // Substitua com os dados que você pegou no Passo 1
        const SUPABASE_URL = "SUA_URL_DO_SUPABASE_AQUI";
        const SUPABASE_KEY = "SUA_CHAVE_ANON_DO_SUPABASE_AQUI";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicialização do Gráfico
        const ctx = document.getElementById('graficoTemperatura').getContext('2d');
        const grafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperatura (°C)',
                    data: [],
                    borderColor: '#f59e0b', // Cor âmbar
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Função para buscar dados do Supabase e atualizar a tela
        async function atualizarDados() {
            // Busca as últimas 20 leituras ordenadas pela mais recente
            const { data, error } = await supabase
                .from('leituras_temperatura')
                .select('*')
                .order('criado_em', { ascending: false })
                .limit(20);

            if (error) {
                console.error("Erro ao buscar dados:", error);
                return;
            }

            if (data && data.length > 0) {
                // Inverte o array para exibir na ordem cronológica correta (esquerda para a direita)
                const dadosCronologicos = data.reverse();

                // Atualiza o cartão do valor atual (último registro inserido)
                const ultimoRegistro = dadosCronologicos[dadosCronologicos.length - 1];
                document.getElementById('temp-atual').innerText = `${ultimoRegistro.temperatura.toFixed(1)}°C`;
                
                const horaLeitura = new Date(ultimoRegistro.criado_em).toLocaleTimeString('pt-BR');
                document.getElementById('tempo-atualizacao').innerText = `Última leitura às ${horaLeitura}`;

                // Atualiza o Gráfico
                const labels = dadosCronologicos.map(item => new Date(item.criado_em).toLocaleTimeString('pt-BR'));
                const valores = dadosCronologicos.map(item => item.temperatura);

                grafico.data.labels = labels;
                grafico.data.datasets[0].data = valores;
                grafico.update();
            }
        }

        // Atualiza ao carregar a página e repete a cada 10 segundos
        atualizarDados();
        setInterval(atualizarDados, 10000);
    </script>
</body>
</html>

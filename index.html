<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - IoT</title>
    <!-- Servidores alternativos para fugir do bloqueio de rede (ERR_CONNECTION_TIMED_OUT) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-gray-800 border-b border-gray-700 p-6 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide uppercase text-yellow-500">[NOME DA SUA EMPRESA]</h1>
        <p class="text-gray-400 text-sm mt-1">Sistema de Telemetria e Monitoramento de Temperatura a Distância</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-6 justify-center">
        
        <!-- Cartão de Destaque -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg text-center max-w-sm mx-auto w-full">
            <h2 class="text-gray-400 font-medium uppercase text-xs tracking-wider">Última Leitura</h2>
            <div class="text-5xl font-black text-yellow-500 mt-2" id="temp-atual">--.-°C</div>
            <p class="text-xs text-gray-500 mt-2" id="tempo-atualizacao">Atualizando...</p>
        </div>

        <!-- Área do Gráfico -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg w-full">
            <canvas id="graficoTemperatura" class="w-full h-72"></canvas>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center p-4 text-xs text-gray-500 border-t border-gray-800">
        &copy; 2026 SYSTEM REFRIGERACAO - Todos os direitos reservados.
    </footer>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (COLOQUE SEUS DADOS REAIS AQUI)
        const SUPABASE_URL = "https://lbdyurjlzsnljjgqffga.supabase.co/rest/v1/leituras_temperatura";
        const SUPABASE_KEY = "sb_publishable_J7GFHjEHu8ZXlQfHghDNcA_2JIwLcT3";
        
        // CORREÇÃO CRÍTICA: Inicializa o cliente do Supabase antes de qualquer outra função tentar usá-lo
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicialização do Gráfico
        const ctx = document.getElementById('graficoTemperatura').getContext('2d');
        const grafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperatura (°C)',
                    data: [],
                    borderColor: '#f59e0b', 
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Função para buscar dados
        async function atualizarDados() {
            const { data, error } = await supabaseClient
                .from('leituras_temperatura')
                .select('*')
                .order('criado_em', { ascending: false })
                .limit(20);

            if (error) {
                console.error("Erro ao buscar dados:", error);
                return;
            }

            if (data && data.length > 0) {
                const dadosCronologicos = data.reverse();
                const ultimoRegistro = dadosCronologicos[dadosCronologicos.length - 1];
                
                const tempElement = document.getElementById('temp-atual');
                const horaLeitura = new Date(ultimoRegistro.criado_em).toLocaleTimeString('pt-BR');
                document.getElementById('tempo-atualizacao').innerText = `Última tentativa às ${horaLeitura}`;

                if (ultimoRegistro.temperatura === -999) {
                    tempElement.innerText = "SENSOR FORA";
                    tempElement.style.color = "#ef4444"; // Força vermelho caso o Tailwind demore para carregar
                    tempElement.style.fontSize = "1.875rem";
                } else {
                    tempElement.innerText = `${ultimoRegistro.temperatura.toFixed(1)}°C`;
                    tempElement.style.color = "#f59e0b"; // Volta para o amarelo/âmbar
                    tempElement.style.fontSize = "3rem";
                }

                const labels = dadosCronologicos.map(item => new Date(item.criado_em).toLocaleTimeString('pt-BR'));
                const valores = dadosCronologicos.map(item => item.temperatura === -999 ? null : item.temperatura);

                grafico.data.labels = labels;
                grafico.data.datasets[0].data = valores;
                grafico.update();
            }
        }

        // Executa imediatamente e agenda para repetir a cada 1 segundo
        atualizarDados();
        setInterval(atualizarDados, 1000);
    </script>
</body>
</html>

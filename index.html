<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - IoT</title>
    
    <!-- Bibliotecas carregadas via UNPKG para evitar o bloqueio de rede da sua operadora -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body style="background-color: #111827; color: #f3f4f6; font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-col; justify-content: space-between; flex-direction: column;">

    <!-- Cabeçalho -->
    <header style="background-color: #1f2937; border-bottom: 1px solid #374151; padding: 24px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
        <h1 style="color: #f59e0b; margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px;">[NOME DA SUA EMPRESA]</h1>
        <p style="color: #9ca3af; margin: 4px 0 0 0; font-size: 14px;">Sistema de Telemetria e Monitoramento de Temperatura a Distância</p>
    </header>

    <!-- Conteúdo Principal -->
    <main style="max-w: 896px; width: 100%; margin: auto; padding: 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 24px; justify-content: center; box-sizing: border-box;">
        
        <!-- Cartão de Destaque -->
        <div style="background-color: #1f2937; padding: 24px; border-radius: 16px; border: 1px solid #374151; text-align: center; max-w: 384px; margin: 0 auto; width: 100%; box-sizing: border-box;">
            <h2 style="color: #9ca3af; margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Última Leitura</h2>
            <div id="temp-atual" style="font-size: 48px; font-weight: 900; color: #f59e0b; margin-top: 8px;">--.-°C</div>
            <p id="tempo-atualizacao" style="font-size: 12px; color: #6b7280; margin: 8px 0 0 0;">Atualizando...</p>
        </div>

        <!-- Área do Gráfico -->
        <div style="background-color: #1f2937; padding: 24px; border-radius: 16px; border: 1px solid #374151; width: 100%; box-sizing: border-box;">
            <div style="height: 288px; width: 100%;">
                <canvas id="graficoTemperatura"></canvas>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer style="text-center; padding: 16px; font-size: 12px; color: #6b7280; border-top: 1px solid #1f2937; text-align: center;">
        &copy; 2026 SYSTEM REFRIGERACAO - Todos os direitos reservados.
    </footer>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (COLOQUE SEUS DADOS REAIS AQUI)
        const SUPABASE_URL = "https://lbdyurjlzsnljjgqffga.supabase.co/rest/v1/leituras_temperatura";
        const SUPABASE_KEY = "sb_publishable_J7GFHjEHu8ZXlQfHghDNcA_2JIwLcT3";
        
        // Inicializa o cliente do Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicialização do Gráfico
        const ctx = document.getElementById('graficoTemperatura').getContext('2d');
        const grafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperatura (°C)',
                    data: [],
                    borderColor: '#f59e0b', 
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Função para buscar dados
        async function atualizarDados() {
            const { data, error } = await supabaseClient
                .from('leituras_temperatura')
                .select('*')
                .order('criado_em', { ascending: false })
                .limit(20);

            if (error) {
                console.error("Erro ao buscar dados:", error);
                return;
            }

            if (data && data.length > 0) {
                const dadosCronologicos = data.reverse();
                const ultimoRegistro = dadosCronologicos[dadosCronologicos.length - 1];
                
                const tempElement = document.getElementById('temp-atual');
                const horaLeitura = new Date(ultimoRegistro.criado_em).toLocaleTimeString('pt-BR');
                document.getElementById('tempo-atualizacao').innerText = `Última tentativa às ${horaLeitura}`;

                if (ultimoRegistro.temperatura === -999) {
                    tempElement.innerText = "SENSOR FORA";
                    tempElement.style.color = "#ef4444"; 
                    tempElement.style.fontSize = "30px";
                } else {
                    tempElement.innerText = `${ultimoRegistro.temperatura.toFixed(1)}°C`;
                    tempElement.style.color = "#f59e0b"; 
                    tempElement.style.fontSize = "48px";
                }

                const labels = dadosCronologicos.map(item => new Date(item.criado_em).toLocaleTimeString('pt-BR'));
                const valores = dadosCronologicos.map(item => item.temperatura === -999 ? null : item.temperatura);

                grafico.data.labels = labels;
                grafico.data.datasets[0].data = valores;
                grafico.update();
            }
        }

        // Executa imediatamente e agenda para repetir a cada 1 segundo
        atualizarDados();
        setInterval(atualizarDados, 1000);
    </script>
</body>
</html>
